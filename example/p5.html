<!DOCTYPE HTML>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.3.1/p5.js" crossorigin=""></script>
    <script src="../dist/skulpt.js" type="text/javascript"></script>
    <script src="../dist/skulpt-stdlib.js" type="text/javascript"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<textarea id="code" rows="24" cols="80">
from p5 import *

def setup():
    createCanvas(400, 400)

def draw():
    if mouseIsPressed:
        fill(0)
    else:
        fill(255)

    circle(mouseX, mouseY, 100)

run()
</textarea>
<input type="button" value="draw" onclick="run()" />
<script>
    function run() {
        if (Sk.p5?.kill) {
            Sk.p5.kill()
        }
        
        var prog = document.getElementById("code").value;
        Sk.configure({
            __future__: Sk.python3
        });


        Sk.misceval.asyncToPromise(function() {
            return Sk.importMainWithBody("<stdin>",false,prog,true);
        });
    }
</script>
</body>
</html>
