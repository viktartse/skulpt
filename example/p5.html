from p5 import *
import math

def setup():
  create_canvas(500, 400, WEBGL)
  background(200);
    
  begin_shape(TESS);

  vertex(-30, -30, 0);
  vertex(30, -30, 0);
  vertex(30, -10, 0);
  vertex(-10, -10, 0);
  vertex(-10, 10, 0);
  vertex(30, 10, 0);
  vertex(30, 30, 0);
  vertex(-30, 30, 0);

  end_shape(CLOSE);

i = 0
direction = 1
    
#def draw():
  #background(100);

  #quad(20, 50, 80, 30, 80, 70, 20, 70);
    
run()

</textarea>

<script>
    var prog = document.getElementById("code").value;
    Sk.configure({
        __future__: Sk.python3
    });


    Sk.misceval.asyncToPromise(function() {
        return Sk.importMainWithBody("<stdin>",false,prog,true);
    });
