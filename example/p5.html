<!DOCTYPE HTML>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.3.1/p5.js" crossorigin=""></script>
    <script src="../dist/skulpt.js" type="text/javascript"></script>
    <script src="../dist/skulpt-stdlib.js" type="text/javascript"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<textarea id="code" rows="24" cols="80">
from p5 import *

def onload(event):
    print("loaded", event.height, event.isModified())

def preload():
    global bottomImg
    bottomImg = loadImage('https://p5js.org/assets/parrot-color.png', onload)
    global topImg
    topImg = loadImage('https://p5js.org/assets/parrot-bw.png', onload)

def setup():
    createCanvas(720, 400)
    image(topImg, 0, 0)

def mouseDragged():
    copy(bottomImg, mouseX, mouseY, 20, 20, mouseX, mouseY, 20, 20)
    
run()
</textarea>
<input type="button" value="draw" onclick="run()" />
<script>
    function run() {
        Sk.p5?.kill?.() 

        const prog = document.getElementById("code").value;
        Sk.configure({
            __future__: Sk.python3,
            debugging: false,
            execLimit: 5000,
        });

        Sk.p5 = {
            node: document.getElementsByTagName("body").item(0)
        }
        
        Sk.uncaughtException = err => {
            console.log(err);
            Sk.p5?.kill?.()
        };

        Sk.misceval
            .asyncToPromise(() => Sk.importMainWithBody('<stdin>', false, prog, false))
            .then(() => {
                console.log("Done");
            })
            .catch((err) => {
                console.log("Error:", err)
            })
        
    }
</script>
</body>
</html>
