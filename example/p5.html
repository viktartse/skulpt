<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/p5.js" crossorigin=""></script>
    <script src="../dist/skulpt.js" type="text/javascript"></script>
    <script src="../dist/skulpt-stdlib.js" type="text/javascript"></script>
    <script type="text/javascript" src="http://ajax.googleapis.com/ajax/libs/jquery/1.6.2/jquery.min.js"> </script>
</head>
<body>
<textarea id="code" rows="24" cols="80">
from p5s import *

def setup():
  createCanvas(710, 400);

  background(0);

  strokeWeight(10);

  colorMode(HSB);
i = 0
    
def draw1():
  global i
  if i % 100 == 0: print(frameRate())
  i += 1
    
  c = color(random(255), random(255), random(255), random(255))
  c.setBlue(200)
  fill(c)
  ellipse(random(width), random(height), 50, 50)

def mouseDragged():
  lineHue = mouseX - mouseY;
  stroke(lineHue, 90, 90);
  line(pmouseX, pmouseY, mouseX, mouseY);

def windowResized(event):
    print("window resized")
run()
</textarea>

<script>
    var prog = document.getElementById("code").value;
    Sk.configure({
        __future__: Sk.python3
    });


    Sk.misceval.asyncToPromise(function() {
        return Sk.importMainWithBody("<stdin>",false,prog,true);
    });
</script>
</body>
</html>
