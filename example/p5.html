<!DOCTYPE HTML>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.2/p5.min.js" crossorigin=""></script>
    <script src="../dist/skulpt.js" type="text/javascript"></script>
    <script src="../dist/skulpt-stdlib.js" type="text/javascript"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<textarea id="code" rows="24" cols="80">
from p5 import *

def setup():
  createCanvas(400, 400)

  button = createButton('click me')
  button.position(150, 200)

  button.mousePressed(repaint)

def repaint():
  background(random(255));


run()
</textarea>
<input type="button" value="draw" onclick="run()" />
<input type="button" value="stop" onclick="stop()" />
<script>
    function stop() {
        Sk.p5?.kill?.()
    }
    
    function run() {
        Sk.p5?.kill?.() 

        const prog = document.getElementById("code").value;
        Sk.configure({
            __future__: Sk.python3,
            debugging: false,
            execLimit: 5000,
            adaptiveJsCallbacks: true
        });

        Sk.p5 = {
            node: document.getElementsByTagName("body").item(0)
        }
        
        Sk.uncaughtException = err => {
            console.log("Error:", err);
            Sk.p5?.kill?.()
        };

        
        Sk.misceval
            .asyncToPromise(() => Sk.importMainWithBody('<stdin>', false, prog, false))
            .then(() => {
                console.log("Done");
            })
            .catch((err) => {
                console.log("Error:", err);
                Sk.p5?.kill?.()
            })
        
    }
</script>
</body>
</html>
