<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.3.1/p5.js" crossorigin=""></script>
    <script src="../dist/skulpt.js" type="text/javascript"></script>
    <script src="../dist/skulpt-stdlib.js" type="text/javascript"></script>
    <script type="text/javascript" src="http://ajax.googleapis.com/ajax/libs/jquery/1.6.2/jquery.min.js"> </script>
</head>
<body>
Sk.p5.instance.loadImage<br>
<textarea id="code" rows="24" cols="80">
from p5 import *

def setup():
    createCanvas(720, 400)

    global capture
    capture = createCapture(VIDEO)

    capture.size(360, 200)

    capture.hide()

def draw():
    background(51)
    image(capture, 0, 0, 360, 400)
    filter(INVERT)

run()
</textarea>
<input type="button" value="draw" onclick="run()" />
<script>
    function run() {
        if (Sk.p5?.kill) {
            Sk.p5.kill()
        }
        
        var prog = document.getElementById("code").value;
        Sk.configure({
            __future__: Sk.python3
        });


        Sk.misceval.asyncToPromise(function() {
            return Sk.importMainWithBody("<stdin>",false,prog,true);
        });
    }
</script>
</body>
</html>
