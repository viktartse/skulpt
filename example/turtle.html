<html>
  <head>
      <meta charset="utf-8">
    <script src="../dist/skulpt.js" type="text/javascript"></script>
    <script src="../dist/skulpt-stdlib.js" type="text/javascript"></script>
    <script type="text/javascript" src="http://ajax.googleapis.com/ajax/libs/jquery/1.6.2/jquery.min.js"> </script>
  </head>

  <body>
    <div id="mycanvas"  height="500" width="1000"
	style="border-style: solid;"></div>

<textarea id="code" rows="24" cols="80">
from turtle import *

setup(440, 80)
width(1)


speed(0);
hideturtle()


def p(x, y):
    penup(), setpos(x, y)
    pendown(), seth(0)


def fill_circle(x, y, r, c=""):
    p(x, y - r)
    color("black", c)
    begin_fill()
    circle(r)
    end_fill()


x = -200; y = 15
r = 10
colormode(255)
c = 255
while x < 200:
    fill_circle(x, y, r, (c, 0, 0))
    x += 20
    c -= 10

done()


</textarea>
    <script>
        var prog = document.getElementById("code").value;
        Sk.configure({
            __future__: Sk.python3
        });
    (Sk.TurtleGraphics || (Sk.TurtleGraphics = {})).target = 'mycanvas';


    Sk.misceval.asyncToPromise(function() {
      return Sk.importMainWithBody("<stdin>",false,prog,true);
    });
    </script>
  </body>
</html>
